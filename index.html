<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Flovly — Fatur & Lyvia</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-pink: #fff0f5;
      --bg-pink-2: #ffe4ee;
      --card-bg: #ffffff;
      --accent: #f24b88;
      --accent-dark: #d83470;
      --accent-soft: #fff5f8;
      --text-main: #3d2430;
      --text-muted: #8c6577;
      --border-soft: #f7dce6;
      --shadow: 0 12px 30px rgba(242, 75, 136, 0.12);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: linear-gradient(180deg, var(--bg-pink) 0%, var(--bg-pink-2) 100%);
      color: var(--text-main);
      min-height: 100vh;
      padding: 24px 16px 40px;
    }

    .container {
      max-width: 480px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .card {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 22px;
      box-shadow: var(--shadow);
      border: 1px solid var(--border-soft);
    }

    .brand-title {
      font-family: 'Pacifico', cursive;
      font-size: 2rem;
      color: var(--accent);
      text-align: center;
      margin-bottom: 6px;
    }

    .subtitle {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.92rem;
      margin-bottom: 18px;
    }

    .timer-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
      text-align: center;
    }

    .time-box {
      background: var(--accent-soft);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 12px 6px;
    }

    .time-num {
      font-size: 1.35rem;
      font-weight: 700;
      color: var(--accent-dark);
      line-height: 1.2;
    }

    .time-label {
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }

    .photo-item {
      position: relative;
      border-radius: 16px;
      overflow: hidden;
      aspect-ratio: 1 / 1;
      background: var(--accent-soft);
      border: 1px solid var(--border-soft);
    }

    .photo-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .upload-btn {
      width: 100%;
      padding: 12px 16px;
      border-radius: 16px;
      border: 1.5px dashed var(--accent);
      background: var(--accent-soft);
      color: var(--accent-dark);
      font-weight: 600;
      font-size: 0.92rem;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .upload-btn:hover {
      background: #ffe8f0;
    }

    .section-title {
      font-family: 'Pacifico', cursive;
      font-size: 1.7rem;
      color: var(--accent);
      text-align: center;
      margin-bottom: 4px;
    }

    .note-form {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-top: 14px;
    }

    .input-field,
    .textarea-field {
      width: 100%;
      border: 1.5px solid var(--border-soft);
      border-radius: 16px;
      padding: 12px 14px;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.92rem;
      color: var(--text-main);
      background: #fffdfd;
      outline: none;
      transition: border-color 0.2s ease;
    }

    .input-field:focus,
    .textarea-field:focus {
      border-color: var(--accent);
    }

    .textarea-field {
      min-height: 86px;
      resize: vertical;
    }

    .submit-btn {
      width: 100%;
      padding: 13px 18px;
      border: none;
      border-radius: 16px;
      background: linear-gradient(135deg, #ff629c 0%, var(--accent) 100%);
      color: #ffffff;
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 0.95rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(242, 75, 136, 0.25);
      transition: transform 0.15s ease, opacity 0.2s ease;
    }

    .submit-btn:active {
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .status-text {
      font-size: 0.8rem;
      color: var(--text-muted);
      text-align: center;
      min-height: 18px;
    }

    .notes-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 16px;
    }

    .note-card {
      background: var(--accent-soft);
      border: 1px solid var(--border-soft);
      border-radius: 16px;
      padding: 12px 14px;
    }

    .note-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      margin-bottom: 6px;
    }

    .note-author {
      font-weight: 700;
      font-size: 0.9rem;
      color: var(--accent-dark);
      word-break: break-word;
    }

    .note-time {
      font-size: 0.75rem;
      color: var(--text-muted);
      white-space: nowrap;
    }

    .note-message {
      font-size: 0.92rem;
      line-height: 1.45;
      color: var(--text-main);
      word-break: break-word;
    }

    .empty-notes {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.86rem;
      padding: 12px 6px;
    }

    footer {
      text-align: center;
      color: var(--text-muted);
      font-size: 0.86rem;
      margin-top: 6px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .visitor-badge {
      display: inline-block;
      margin: 0 auto;
      background: rgba(255, 255, 255, 0.75);
      border: 1px solid var(--border-soft);
      color: var(--accent-dark);
      font-weight: 600;
      font-size: 0.8rem;
      padding: 5px 12px;
      border-radius: 999px;
    }
  </style>
</head>
<body>
  <main class="container">
    <section class="card">
      <h1 class="brand-title">Fatur &amp; Lyvia</h1>
      <p class="subtitle">Bersama sejak 26 Juni 2026</p>
      <div class="timer-grid">
        <div class="time-box">
          <div class="time-num" id="days">0</div>
          <div class="time-label">DAYS</div>
        </div>
        <div class="time-box">
          <div class="time-num" id="hours">00</div>
          <div class="time-label">HOURS</div>
        </div>
        <div class="time-box">
          <div class="time-num" id="mins">00</div>
          <div class="time-label">MINS</div>
        </div>
        <div class="time-box">
          <div class="time-num" id="secs">00</div>
          <div class="time-label">SECS</div>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="gallery-grid" id="galleryGrid">
        <div class="photo-item"><img src="foto1.jpg" alt="Kenangan 1" /></div>
        <div class="photo-item"><img src="foto2.jpg" alt="Kenangan 2" /></div>
        <div class="photo-item"><img src="foto3.jpg" alt="Kenangan 3" /></div>
        <div class="photo-item"><img src="foto4.jpg" alt="Kenangan 4" /></div>
      </div>
      <input type="file" id="photoInput" accept="image/*" multiple hidden />
      <button type="button" class="upload-btn" id="addPhotoBtn">📷 Tambah Foto Kenangan Lainnya</button>
    </section>

    <section class="card">
      <h2 class="section-title">Sweet Notes</h2>
      <p class="subtitle">Tulis catatan manis atau komentar untuk Fatur &amp; Lyvia</p>

      <form class="note-form" id="noteForm">
        <input
          type="text"
          id="authorInput"
          class="input-field"
          placeholder="Nama kamu..."
          maxlength="40"
          required
        />
        <textarea
          id="messageInput"
          class="textarea-field"
          placeholder="Tulis pesan atau ucapan..."
          maxlength="400"
          required
        ></textarea>
        <button type="submit" class="submit-btn" id="submitBtn">💬 Kirim Ucapan</button>
        <div class="status-text" id="statusText"></div>
      </form>

      <div class="notes-list" id="notesList">
        <div class="empty-notes">Memuat ucapan...</div>
      </div>
    </section>

    <footer>
      <div>Made with ❤️ for Lyvia</div>
      <div class="visitor-badge" id="visitorCount">👀 Total kunjungan: memuat...</div>
    </footer>
  </main>

  <script>
    const DB_URL = "https://flofy-notes-default-rtdb.asia-southeast1.firebasedatabase.app";

    const startDate = new Date("2026-06-26T00:00:00+07:00").getTime();

    function updateCounter() {
      const now = Date.now();
      const diff = Math.max(0, now - startDate);

      const days = Math.floor(diff / (1000 * 60 * 60 * 24));
      const hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
      const mins = Math.floor((diff / (1000 * 60)) % 60);
      const secs = Math.floor((diff / 1000) % 60);

      document.getElementById("days").textContent = days;
      document.getElementById("hours").textContent = String(hours).padStart(2, "0");
      document.getElementById("mins").textContent = String(mins).padStart(2, "0");
      document.getElementById("secs").textContent = String(secs).padStart(2, "0");
    }

    updateCounter();
    setInterval(updateCounter, 1000);

    const photoInput = document.getElementById("photoInput");
    const addPhotoBtn = document.getElementById("addPhotoBtn");
    const galleryGrid = document.getElementById("galleryGrid");

    addPhotoBtn.addEventListener("click", () => photoInput.click());

    photoInput.addEventListener("change", (event) => {
      const files = Array.from(event.target.files || []);
      files.forEach((file) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const item = document.createElement("div");
          item.className = "photo-item";
          const img = document.createElement("img");
          img.src = e.target.result;
          img.alt = file.name;
          item.appendChild(img);
          galleryGrid.appendChild(item);
        };
        reader.readAsDataURL(file);
      });
      photoInput.value = "";
    });

    function formatShortDate(timestamp) {
      const d = new Date(timestamp);
      const months = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];
      const day = d.getDate();
      const month = months[d.getMonth()];
      const hh = String(d.getHours()).padStart(2, "0");
      const mm = String(d.getMinutes()).padStart(2, "0");
      return `${day} ${month} • ${hh}.${mm}`;
    }

    const notesList = document.getElementById("notesList");
    const noteForm = document.getElementById("noteForm");
    const authorInput = document.getElementById("authorInput");
    const messageInput = document.getElementById("messageInput");
    const submitBtn = document.getElementById("submitBtn");
    const statusText = document.getElementById("statusText");

    async function loadNotes() {
      try {
        const res = await fetch(`${DB_URL}/notes.json`);
        const data = await res.json();

        notesList.innerHTML = "";
        if (!data || typeof data !== "object") {
          notesList.innerHTML = `<div class="empty-notes">Belum ada ucapan. Yuk jadi yang pertama mengirim!</div>`;
          return;
        }

        const items = Object.entries(data)
          .map(([id, val]) => ({ id, ...val }))
          .filter((item) => item && (item.author || item.message))
          .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));

        if (items.length === 0) {
          notesList.innerHTML = `<div class="empty-notes">Belum ada ucapan. Yuk jadi yang pertama mengirim!</div>`;
          return;
        }

        items.forEach((note) => {
          const card = document.createElement("div");
          card.className = "note-card";

          const header = document.createElement("div");
          header.className = "note-header";

          const author = document.createElement("div");
          author.className = "note-author";
          author.textContent = note.author || "Anonim";

          const time = document.createElement("div");
          time.className = "note-time";
          time.textContent = formatShortDate(note.createdAt || Date.now());

          const msg = document.createElement("div");
          msg.className = "note-message";
          msg.textContent = note.message || "";

          header.appendChild(author);
          header.appendChild(time);
          card.appendChild(header);
          card.appendChild(msg);
          notesList.appendChild(card);
        });
      } catch (err) {
        notesList.innerHTML = `<div class="empty-notes">Gagal memuat ucapan. Coba muat ulang halaman.</div>`;
      }
    }

    noteForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const author = authorInput.value.trim();
      const message = messageInput.value.trim();
      if (!author || !message) return;

      submitBtn.disabled = true;
      statusText.textContent = "Mengirim ucapan...";

      try {
        const res = await fetch(`${DB_URL}/notes.json`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            author,
            message,
            createdAt: Date.now()
          })
        });

        const result = await res.json();
        if (!res.ok || !result || !result.name) {
          throw new Error("Gagal menyimpan ke database");
        }

        messageInput.value = "";
        statusText.textContent = "Ucapan terkirim dan bisa dilihat di semua HP!";
        await loadNotes();
      } catch (err) {
        statusText.textContent = "Terjadi kendala saat mengirim. Coba lagi ya.";
      } finally {
        submitBtn.disabled = false;
      }
    });

    const visitorEl = document.getElementById("visitorCount");

    async function updateVisitorCount() {
      try {
        const getRes = await fetch(`${DB_URL}/visitors.json`);
        const currentCount = Number(await getRes.json()) || 0;
        const nextCount = currentCount + 1;

        await fetch(`${DB_URL}/visitors.json`, {
          method: "PUT",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(nextCount)
        });

        visitorEl.textContent = `👀 Total kunjungan: ${nextCount.toLocaleString("id-ID")}`;
      } catch (err) {
        visitorEl.textContent = `👀 Total kunjungan: -`;
      }
    }

    loadNotes();
    updateVisitorCount();
  </script>
</body>
</html>
