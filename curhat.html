<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruang Cerita Lyvia</title>
  <style>
    :root {
      --bg: #fdf6f8;
      --card: #ffffff;
      --primary: #d96b8a;
      --primary-dark: #b8506e;
      --text: #2c2427;
      --muted: #7a6b70;
      --bubble-ai: #f6e8ed;
      --bubble-user: #d96b8a;
      --border: #edd9e0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background: linear-gradient(160deg, #fff5f8 0%, #f5eef9 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 14px;
    }

    .chat-app {
      width: 100%;
      max-width: 460px;
      height: 88vh;
      max-height: 760px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 22px;
      box-shadow: 0 14px 36px rgba(140, 65, 92, 0.12);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .header {
      padding: 16px 18px;
      background: var(--primary);
      color: #fff;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header h1 {
      font-size: 1.05rem;
      font-weight: 700;
    }

    .header p {
      font-size: 0.78rem;
      opacity: 0.92;
      margin-top: 2px;
    }

    .reset-btn {
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      border: 1px solid rgba(255, 255, 255, 0.35);
      border-radius: 10px;
      padding: 6px 10px;
      font-size: 0.75rem;
      cursor: pointer;
    }

    .reset-btn:hover {
      background: rgba(255, 255, 255, 0.3);
    }

    .key-box {
      padding: 10px 16px;
      background: #fff9fb;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .key-box label {
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--muted);
      white-space: nowrap;
    }

    .key-box input {
      flex: 1;
      padding: 8px 11px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 0.85rem;
      outline: none;
      background: #fff;
    }

    .key-box input:focus {
      border-color: var(--primary);
    }

    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      background: var(--bg);
    }

    .bubble {
      max-width: 82%;
      padding: 11px 14px;
      border-radius: 16px;
      font-size: 0.92rem;
      line-height: 1.45;
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    .bubble.ai {
      align-self: flex-start;
      background: var(--bubble-ai);
      color: var(--text);
      border-bottom-left-radius: 4px;
    }

    .bubble.user {
      align-self: flex-end;
      background: var(--bubble-user);
      color: #fff;
      border-bottom-right-radius: 4px;
    }

    .bubble.error {
      align-self: center;
      background: #ffe5e8;
      color: #9e1b2b;
      font-size: 0.82rem;
      border-radius: 12px;
    }

    .typing {
      font-size: 0.8rem;
      color: var(--muted);
      padding: 0 16px 8px;
      min-height: 22px;
    }

    .input-area {
      padding: 12px;
      background: #fff;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
      align-items: flex-end;
    }

    .input-area textarea {
      flex: 1;
      resize: none;
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 10px 12px;
      font-size: 0.92rem;
      max-height: 110px;
      min-height: 42px;
      outline: none;
      line-height: 1.35;
    }

    .input-area textarea:focus {
      border-color: var(--primary);
    }

    .send-btn {
      background: var(--primary);
      color: #fff;
      border: none;
      border-radius: 14px;
      padding: 11px 16px;
      font-weight: 600;
      font-size: 0.9rem;
      cursor: pointer;
      height: 42px;
    }

    .send-btn:hover:not(:disabled) {
      background: var(--primary-dark);
    }

    .send-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
  </style>
</head>
<body>
  <div class="chat-app">
    <div class="header">
      <div>
        <h1>Ruang Cerita Lyvia</h1>
        <p>Aman, hangat, dan siap mendengarkan</p>
      </div>
      <button class="reset-btn" id="resetBtn" type="button">Chat Baru</button>
    </div>

    <div class="key-box">
      <label for="keywordInput">Kata Kunci</label>
      <input
        type="password"
        id="keywordInput"
        placeholder="Masukkan kata kunci rahasia..."
        autocomplete="off"
      />
    </div>

    <div class="messages" id="messages">
      <div class="bubble ai">
        Halo Lyvia. Ceritain aja apa pun yang lagi kamu rasain hari ini—lagi capek, senang, atau kepikiran sesuatu. Aku di sini buat dengerin.
      </div>
    </div>

    <div class="typing" id="typing"></div>

    <form class="input-area" id="chatForm">
      <textarea
        id="messageInput"
        rows="1"
        placeholder="Tulis curhatan kamu di sini..."
        required
      ></textarea>
      <button class="send-btn" id="sendBtn" type="submit">Kirim</button>
    </form>
  </div>

  <script>
    const WORKER_URL = "https://lyvia-curhat-api.faturfirmansyahlaksono-9d2.workers.dev";

    const messagesEl = document.getElementById("messages");
    const chatForm = document.getElementById("chatForm");
    const messageInput = document.getElementById("messageInput");
    const keywordInput = document.getElementById("keywordInput");
    const sendBtn = document.getElementById("sendBtn");
    const resetBtn = document.getElementById("resetBtn");
    const typingEl = document.getElementById("typing");

    let history = [];

    function addBubble(text, type = "ai") {
      const div = document.createElement("div");
      div.className = `bubble ${type}`;
      div.textContent = text;
      messagesEl.appendChild(div);
      messagesEl.scrollTop = messagesEl.scrollHeight;
    }

    messageInput.addEventListener("input", () => {
      messageInput.style.height = "auto";
      messageInput.style.height = Math.min(messageInput.scrollHeight, 110) + "px";
    });

    messageInput.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        chatForm.requestSubmit();
      }
    });

    resetBtn.addEventListener("click", () => {
      history = [];
      messagesEl.innerHTML = "";
      addBubble(
        "Obrolan baru dimulai. Kamu mau cerita tentang apa hari ini?",
        "ai"
      );
    });

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();

      const keyword = keywordInput.value.trim();
      const message = messageInput.value.trim();

      if (!keyword) {
        addBubble("Isi dulu kata kunci rahasianya ya.", "error");
        keywordInput.focus();
        return;
      }

      if (!message) return;

      addBubble(message, "user");
      messageInput.value = "";
      messageInput.style.height = "auto";
      sendBtn.disabled = true;
      typingEl.textContent = "Sedang mengetik balasan...";

      try {
        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            keyword,
            message,
            history
          })
        });

        const data = await res.json();

        if (!res.ok) {
          addBubble(data.error || "Gagal mendapatkan balasan.", "error");
          return;
        }

        const reply = data.reply || "Aku di sini mendengarkan kamu.";
        addBubble(reply, "ai");

        history.push({ role: "user", text: message });
        history.push({ role: "model", text: reply });
      } catch (err) {
        addBubble("Koneksi bermasalah. Coba cek jaringan lalu kirim lagi.", "error");
      } finally {
        sendBtn.disabled = false;
        typingEl.textContent = "";
        messageInput.focus();
      }
    });
  </script>
</body>
</html>
